<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
    <h1>Login</h1>

     <form>
        <label for="uname">User Name:</label><br>
        <input type="email" id="uname" name="uname" placeholder="Enter your email/username" required>

        <label for="pwd" >Password</label><br>
        <input type="password" id="pwd" name="pwd" placeholder="Enter your password" required>

    <button type="submit" class="login">Login</button>
    <p class="sign-up">Don't have an account? <a href="signup.html">Sign up</a></p>
   </form>
   </div> 
   <script src="login.js"></script>
</body>
</html>
